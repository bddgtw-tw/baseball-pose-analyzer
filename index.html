<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>棒球動作分析器</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<style>
:root{color-scheme:dark;--bg:#0b1111;--panel:#15201e;--line:#30423b;--text:#f3f7f2;--muted:#a9b8ae;--accent:#b8e6cf;--yellow:#e6f273}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,"Noto Sans TC",sans-serif}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#26312e;color:var(--text);border-radius:12px;padding:11px 15px;min-height:44px}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);color:#10221b;border-color:var(--accent);font-weight:700}.wrap{max-width:1120px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.top h1{font-size:clamp(23px,3vw,34px);letter-spacing:-.04em;margin:0}.top p{margin:2px 0 0;color:var(--muted);font-size:13px}.sources{display:flex;gap:8px}.sources input{display:none}.stage{background:#050808;border:1px solid var(--line);border-radius:18px;overflow:hidden}.screen{position:relative;max-height:72vh;min-height:260px;display:grid;place-items:center;aspect-ratio:16/9;background:#030606}.screen video,.screen canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.screen canvas{pointer-events:none}.empty{position:absolute;z-index:2;text-align:center;padding:20px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:21px}.badge{position:absolute;z-index:3;top:12px;left:12px;max-width:calc(100% - 24px);background:#101b1be8;padding:6px 10px;border-radius:8px;font-size:12px}.controls{padding:16px}.timeline{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}.timeline input{flex:1;accent-color:var(--accent);min-width:0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}.row .spacer{flex:1}.row label{display:flex;align-items:center;gap:5px;color:var(--muted)}.row select{background:#26312e;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:25px;font-variant-numeric:tabular-nums}.note{color:var(--muted);font-size:13px;margin:8px 0}.download{display:flex;gap:8px;margin:16px 0}.download button{flex:1}.hidden{display:none!important}
@media(max-width:700px){.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}.sources{width:100%}.sources button{flex:1}.screen{min-height:260px;max-height:65vh}.controls{padding:12px}.row{display:grid;grid-template-columns:repeat(4,1fr)}.row button{padding:10px 4px}.row .spacer{display:none}.row label{grid-column:span 2}.row select{grid-column:span 2}.metrics{grid-template-columns:repeat(2,1fr)}.download{flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div><h1>棒球動作分析器</h1><p>選影片 → 看骨架與角度 → 逐格回看 → 下載</p></div><div class="sources"><input id="file" type="file" accept="video/*"><input id="camera" type="file" accept="video/*" capture="environment"><button id="choose" class="primary">選擇影片</button><button id="shoot">拍攝影片</button></div></header>
<main>
<section class="stage"><div id="screen" class="screen"><video id="video" playsinline preload="metadata"></video><canvas id="overlay"></canvas><div id="empty" class="empty"><strong>選一段球員影片開始</strong>讓全身入鏡，盡量固定拍攝角度。</div><div id="status" class="badge">等待影片</div></div>
<div class="controls"><div class="timeline"><span id="time">00:00.00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="影片時間軸"><span id="duration">00:00.00</span></div>
<div class="row"><button id="back5">−5 格</button><button id="back1">−1 格</button><button id="play" class="primary">播放</button><button id="next1">+1 格</button><button id="next5">+5 格</button><span class="spacer"></span><label><input id="loop" type="checkbox" checked>循環</label><select id="speed" aria-label="播放速度"><option value="0.1">0.10×</option><option value="0.25">0.25×</option><option value="0.5">0.50×</option><option value="0.75">0.75×</option><option value="1" selected>1.00×</option></select></div></div></section>
<section class="metrics" aria-label="關節角度"><div class="metric"><small>左肘夾角</small><strong id="le">—</strong></div><div class="metric"><small>右肘夾角</small><strong id="re">—</strong></div><div class="metric"><small>左膝夾角</small><strong id="lk">—</strong></div><div class="metric"><small>右膝夾角</small><strong id="rk">—</strong></div></section>
<p class="note">黃線為肩膀至骨盆的 2D 中軸，黃點為骨盆位置參考。單一鏡頭無法量出真正的 3D 重心。影格以影片畫面估算，未估出前暫用 30 fps。</p>
<div class="download"><button id="image" disabled>下載骨架影格圖</button><button id="export" disabled>下載骨架影片</button></div>
</main></div>
<script>
(function(){
  var video=document.getElementById('video'),screen=document.getElementById('screen'),canvas=document.getElementById('overlay'),ctx=canvas.getContext('2d');
  var input=document.createElement('canvas'),ictx=input.getContext('2d',{alpha:false});
  var status=document.getElementById('status'),seek=document.getElementById('seek'),play=document.getElementById('play');
  var url=null,pose=null,busy=false,playing=false,raf=0,lastInfer=0,landmarks=null,source=0,fps=30,lastMediaTime=null,samples=[],exporting=false,recorder=null,exportCanvas=null,exportCtx=null,oldTime=0,oldLoop=false;
  var metricIds=['le','re','lk','rk'],joints=[[11,13,15],[12,14,16],[23,25,27],[24,26,28]];
  function time(t){if(!isFinite(t))t=0;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+String(Math.floor(t*100)%100).padStart(2,'0')}
  function setStatus(t){status.textContent=t}
  function point(lm,i){var p=lm&&lm[i];return p&&p.visibility>=.5?{x:p.x*canvas.width,y:p.y*canvas.height}:null}
  function angle(a,b,c){if(!a||!b||!c)return null;var x=a.x-b.x,y=a.y-b.y,u=c.x-b.x,v=c.y-b.y,l=Math.hypot(x,y)*Math.hypot(u,v);return l>1?Math.round(Math.acos(Math.max(-1,Math.min(1,(x*u+y*v)/l)))*180/Math.PI):null}
  function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);landmarks=null;metricIds.forEach(function(id){document.getElementById(id).textContent='—'})}
  function render(lm){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(!lm){metricIds.forEach(function(id){document.getElementById(id).textContent='—'});return}
    if(window.drawConnectors&&window.POSE_CONNECTIONS)drawConnectors(ctx,lm,POSE_CONNECTIONS,{color:'#a5dec8',lineWidth:Math.max(2,canvas.width/450),visibilityMin:.5});
    if(window.drawLandmarks)drawLandmarks(ctx,lm,{color:'#efffea',fillColor:'#a5dec8',radius:Math.max(3,canvas.width/260),visibilityMin:.5});
    joints.forEach(function(j,n){var v=angle(point(lm,j[0]),point(lm,j[1]),point(lm,j[2]));document.getElementById(metricIds[n]).textContent=v===null?'—':v+'°'});
    var a=point(lm,11),b=point(lm,12),c=point(lm,23),d=point(lm,24);
    if(a&&b&&c&&d){var sx=(a.x+b.x)/2,sy=(a.y+b.y)/2,hx=(c.x+d.x)/2,hy=(c.y+d.y)/2;ctx.save();ctx.strokeStyle='#e6f273';ctx.fillStyle='#e6f273';ctx.lineWidth=Math.max(3,canvas.width/300);ctx.setLineDash([10,7]);ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(hx,hy);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(hx,hy,Math.max(6,canvas.width/160),0,Math.PI*2);ctx.fill();ctx.restore()}
  }
  try{pose=new Pose({locateFile:function(f){return 'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f}});pose.setOptions({modelComplexity:0,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:.5,minTrackingConfidence:.5});pose.onResults(function(result){landmarks=result.poseLandmarks||null;render(landmarks);setStatus(landmarks?'骨架辨識中':'未辨識到完整球員；請讓全身入鏡')})}catch(e){setStatus('姿態模型未載入，請重新整理')}
  async function infer(force){if(!pose||!video.videoWidth||busy)return;var now=performance.now();if(!force&&now-lastInfer<60)return;lastInfer=now;busy=true;var id=source;try{var scale=Math.min(1,640/Math.max(video.videoWidth,video.videoHeight)),w=Math.round(video.videoWidth*scale),h=Math.round(video.videoHeight*scale);if(input.width!==w||input.height!==h){input.width=w;input.height=h}ictx.drawImage(video,0,0,w,h);await pose.send({image:input});if(id!==source)clear()}catch(e){clear();setStatus('姿態辨識失敗：'+String(e.message||e).slice(0,65))}finally{busy=false}}
  function tick(){if(!playing)return;infer(false);if(exporting)drawExport();raf=requestAnimationFrame(tick)}
  function pause(){video.pause();playing=false;cancelAnimationFrame(raf);play.textContent='播放'}
  function updateTime(){document.getElementById('time').textContent=time(video.currentTime);if(isFinite(video.duration)&&video.duration>0)seek.value=Math.round(1000*video.currentTime/video.duration)}
  function load(file){if(!file||!file.type.startsWith('video/')){setStatus('請選擇影片檔');return}pause();source++;clear();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);video.src=url;video.load();document.getElementById('empty').classList.add('hidden');setStatus('載入影片中…')}
  function step(n){if(!video.duration)return;pause();video.currentTime=Math.max(0,Math.min(video.duration-.001,video.currentTime+n/fps))}
  document.getElementById('choose').onclick=function(){document.getElementById('file').click()};
  document.getElementById('shoot').onclick=function(){document.getElementById('camera').click()};
  ['file','camera'].forEach(function(id){var el=document.getElementById(id);el.onchange=function(){if(el.files[0])load(el.files[0]);el.value=''}});
  video.onloadedmetadata=function(){var w=video.videoWidth,h=video.videoHeight,s=Math.min(1,1600/Math.max(w,h));canvas.width=Math.round(w*s);canvas.height=Math.round(h*s);screen.style.aspectRatio=w+' / '+h;document.getElementById('duration').textContent=time(video.duration);document.getElementById('image').disabled=false;document.getElementById('export').disabled=!(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream);fps=30;samples=[];lastMediaTime=null;setStatus('影片已載入，開始辨識');infer(true)};
  if(video.requestVideoFrameCallback){var observe=function(now,meta){if(meta.mediaTime!==undefined){var delta=meta.mediaTime-lastMediaTime;if(lastMediaTime!==null&&delta>.004&&delta<.2){samples.push(1/delta);if(samples.length>9)samples.shift();if(samples.length>=5){var a=samples.slice().sort(function(x,y){return x-y});fps=Math.max(10,Math.min(240,Math.round(a[Math.floor(a.length/2)])))}}lastMediaTime=meta.mediaTime}video.requestVideoFrameCallback(observe)};video.requestVideoFrameCallback(observe)}
  video.onloadeddata=function(){infer(true)};
  video.onseeked=function(){updateTime();infer(true)};
  video.ontimeupdate=updateTime;
  video.onplay=function(){playing=true;play.textContent='暫停';cancelAnimationFrame(raf);tick()};
  video.onpause=function(){playing=false;play.textContent='播放';cancelAnimationFrame(raf)};
  video.onended=function(){if(exporting){finishExport();return}if(document.getElementById('loop').checked){video.currentTime=0;video.play()}else pause()};
  play.onclick=function(){if(!video.src){setStatus('請先選擇或拍攝影片');return}if(video.paused)video.play().catch(function(e){setStatus('無法播放：'+e.message)});else pause()};
  [['back1',-1],['back5',-5],['next1',1],['next5',5]].forEach(function(p){document.getElementById(p[0]).onclick=function(){step(p[1])}});
  seek.oninput=function(){if(!video.duration)return;pause();video.currentTime=video.duration*Number(seek.value)/1000};
  document.getElementById('speed').onchange=function(e){video.playbackRate=Number(e.target.value)};
  function composite(target,context){target.width=canvas.width;target.height=canvas.height;context.drawImage(video,0,0,target.width,target.height);context.drawImage(canvas,0,0,target.width,target.height)}
  document.getElementById('image').onclick=function(){if(!video.videoWidth)return;var out=document.createElement('canvas'),c=out.getContext('2d');composite(out,c);out.toBlob(function(blob){if(blob)download(blob,'baseball-frame.png')},'image/png')};
  function download(blob,name){var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},30000)}
  function drawExport(){if(!exporting)return;exportCtx.drawImage(video,0,0,exportCanvas.width,exportCanvas.height);exportCtx.drawImage(canvas,0,0,exportCanvas.width,exportCanvas.height)}
  function finishExport(){if(!exporting)return;exporting=false;pause();if(recorder&&recorder.state!=='inactive')recorder.stop()}
  document.getElementById('export').onclick=async function(){if(!video.duration||exporting)return;var types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];var mime=types.find(function(t){return MediaRecorder.isTypeSupported(t)});if(!mime){setStatus('此瀏覽器不支援影片匯出');return}exportCanvas=document.createElement('canvas');exportCanvas.width=canvas.width;exportCanvas.height=canvas.height;exportCtx=exportCanvas.getContext('2d');var chunks=[];oldTime=video.currentTime;oldLoop=video.loop;pause();video.loop=false;recorder=new MediaRecorder(exportCanvas.captureStream(30),{mimeType:mime});recorder.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};recorder.onstop=function(){download(new Blob(chunks,{type:mime}),'baseball-skeleton.'+(mime.includes('mp4')?'mp4':'webm'));video.loop=oldLoop;video.currentTime=oldTime;document.getElementById('export').disabled=false;setStatus('影片已下載')};document.getElementById('export').disabled=true;video.currentTime=0;await new Promise(function(resolve){video.addEventListener('seeked',resolve,{once:true})});exporting=true;drawExport();recorder.start();video.play().catch(function(e){finishExport();setStatus('匯出失敗：'+e.message)});setStatus('正在合成影片，請保持頁面開啟')};
  window.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.code==='Space'){e.preventDefault();play.click()}});
})();
</script></body></html>
