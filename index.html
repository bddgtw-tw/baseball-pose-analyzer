<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>棒球動作分析器</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<style>
:root{color-scheme:dark;--bg:#0d1413;--surface:#172321;--surface2:#1d2d29;--line:#354a42;--text:#f4f5ee;--muted:#aebcb4;--accent:#bce8cd;--accent2:#e9c98b;--ink:#102019}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 78% -12%,#263d32 0,transparent 36%);opacity:.55}
button,select{font:inherit}
button{min-height:48px;padding:10px 17px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--text);font-weight:650;cursor:pointer;transition:background .16s,border-color .16s,transform .16s}
button:hover{background:#294037;border-color:#739b85}
button:active{transform:scale(.98)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
button:disabled{opacity:.42;cursor:not-allowed;transform:none}
.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.primary:hover{background:#d4f4dc;border-color:#d4f4dc}
.wrap{position:relative;max-width:1180px;margin:auto;padding:26px clamp(16px,4vw,44px) 48px}
.top{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.top>div:first-child:before{content:"MOTION STUDY  /  BASEBALL";display:block;margin-bottom:8px;color:var(--accent2);font:700 11px/1.2 ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em}
.top h1{font-size:clamp(27px,3.4vw,42px);line-height:1.15;letter-spacing:-.045em;margin:0}
.top p{margin:9px 0 0;color:var(--muted);font-size:14px}
.sources{display:flex;gap:10px;flex-shrink:0}
.sources input{display:none}
.sources button{min-width:124px}
.stage{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 65px #0003}
.screen{position:relative;display:grid;place-items:center;aspect-ratio:16/9;min-height:250px;background:#050908}
.screen video,.screen canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.screen canvas{pointer-events:none}
.empty{position:absolute;z-index:2;text-align:center;max-width:380px;padding:24px;color:var(--muted);font-size:14px}
.empty:before{content:"◌";display:block;color:var(--accent);font-size:58px;line-height:1;margin-bottom:14px}
.empty strong{display:block;margin-bottom:8px;color:var(--text);font-size:22px;letter-spacing:-.03em}
.badge{position:absolute;z-index:3;top:14px;left:14px;max-width:calc(100% - 28px);padding:7px 11px;border:1px solid #526e5c88;border-radius:8px;background:#101b19e8;color:#d9e8df;font-size:12px;line-height:1.35;backdrop-filter:blur(10px)}
.badge:before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--accent)}
.controls{padding:19px 22px 21px}
.timeline{display:flex;align-items:center;gap:14px;color:var(--muted);font:13px ui-monospace,SFMono-Regular,monospace;font-variant-numeric:tabular-nums}
.timeline input{flex:1;min-width:0;height:28px;accent-color:var(--accent);cursor:pointer}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:14px}
.row .spacer{flex:1}
.row label{display:flex;align-items:center;gap:9px;min-height:48px;padding:0 11px;color:var(--text);font-size:14px}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.row select{min-height:48px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);cursor:pointer}
#play{min-width:96px}
.note{margin:0;color:var(--muted);font-size:12px;line-height:1.65}
.download{display:flex;gap:10px;margin-top:22px}
.download button{flex:1;min-height:52px}
.download button:first-child{border-color:#86a996;color:var(--accent)}
.hidden{display:none!important}
@media(max-width:820px){.top{align-items:flex-start;flex-direction:column}.sources{width:100%}.sources button{flex:1}.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.row button{min-width:0;padding:9px 3px;font-size:13px}.row .spacer{display:none}.row label{grid-column:span 2;justify-content:center}.row select{grid-column:span 3}}
@media(max-width:540px){.wrap{padding:18px 12px 36px}.top{gap:18px;margin-bottom:17px;padding-bottom:19px}.top h1{font-size:28px}.top p{font-size:12px}.sources button{min-width:0;padding:10px 6px;font-size:14px}.stage{border-radius:13px}.screen{min-height:238px}.badge{top:9px;left:9px;font-size:11px}.controls{padding:12px}.timeline{gap:8px;font-size:11px}.row{gap:5px;margin-top:10px}.row button{font-size:12px;min-height:46px}.row label,.row select{min-height:44px}.download{flex-direction:column;margin-top:17px}.download button{min-height:48px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div><h1>棒球動作分析器</h1><p>選影片 → 看骨架與角度 → 逐格回看 → 下載</p></div><div class="sources"><input id="file" type="file" accept="video/*"><input id="camera" type="file" accept="video/*" capture="environment"><button id="choose" class="primary">選擇影片</button><button id="shoot">拍攝影片</button></div></header>
<main>
<section class="stage"><div id="screen" class="screen"><video id="video" playsinline preload="metadata"></video><canvas id="overlay"></canvas><div id="empty" class="empty"><strong>選一段球員影片開始</strong>讓全身入鏡，盡量固定拍攝角度。</div><div id="status" class="badge">等待影片</div></div>
<div class="controls"><div class="timeline"><span id="time">00:00.00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="影片時間軸"><span id="duration">00:00.00</span></div>
<div class="row"><button id="back5">−5 格</button><button id="back1">−1 格</button><button id="play" class="primary">播放</button><button id="next1">+1 格</button><button id="next5">+5 格</button><span class="spacer"></span><label><input id="loop" type="checkbox" checked>循環</label><select id="speed" aria-label="播放速度"><option value="0.1">0.10×</option><option value="0.25">0.25×</option><option value="0.5">0.50×</option><option value="0.75">0.75×</option><option value="1" selected>1.00×</option></select></div></div></section>
<p class="note">橘線是身體中軸；黃色圓點是 2D 重心參考；虛線末端的小點依可見的腳部落點估算，不是實際地面平面或 3D 重心。影格以影片畫面估算，未估出前暫用 30 fps。</p>
<div class="download"><button id="image" disabled>下載骨架影格圖</button><button id="export" disabled>下載骨架影片</button></div>
</main></div>
<script>
(function(){
  var video=document.getElementById('video'),screen=document.getElementById('screen'),canvas=document.getElementById('overlay'),ctx=canvas.getContext('2d');
  var input=document.createElement('canvas'),ictx=input.getContext('2d',{alpha:false});
  var status=document.getElementById('status'),seek=document.getElementById('seek'),play=document.getElementById('play');
  var url=null,pose=null,busy=false,playing=false,raf=0,lastInfer=0,landmarks=null,source=0,fps=30,lastMediaTime=null,samples=[],exporting=false,recorder=null,exportCanvas=null,exportCtx=null,oldTime=0,oldLoop=false;
  var joints=[[11,13,15],[12,14,16],[23,25,27],[24,26,28]];
  function time(t){if(!isFinite(t))t=0;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+String(Math.floor(t*100)%100).padStart(2,'0')}
  function setStatus(t){status.textContent=t}
  function point(lm,i){var p=lm&&lm[i];return p&&p.visibility>=((i>=29&&i<=32)?.35:.5)?{x:p.x*canvas.width,y:p.y*canvas.height}:null}
  function angle(a,b,c){if(!a||!b||!c)return null;var x=a.x-b.x,y=a.y-b.y,u=c.x-b.x,v=c.y-b.y,l=Math.hypot(x,y)*Math.hypot(u,v);return l>1?Math.round(Math.acos(Math.max(-1,Math.min(1,(x*u+y*v)/l)))*180/Math.PI):null}
  function clear(){ctx.clearRect(0,0,canvas.width,canvas.height);landmarks=null}
  function midpoint(a,b){return a&&b?{x:(a.x+b.x)/2,y:(a.y+b.y)/2}:null}
  function drawJointAngle(label,at,value,center){
    if(value===null||!at)return;
    ctx.save();
    var size=Math.max(15,Math.min(26,canvas.width/58)),pad=size*.55,height=size*1.85;
    ctx.font='600 '+size+'px system-ui, sans-serif';
    var text=label+' '+value+'°',width=ctx.measureText(text).width+pad*2;
    var side=center&&at.x<center.x?-1:1;
    var x=Math.max(5,Math.min(canvas.width-width-5,at.x+(side<0?-width-size:size)));
    var y=Math.max(5,Math.min(canvas.height-height-5,at.y-height/2));
    ctx.fillStyle='rgba(5,16,14,.88)';ctx.fillRect(x,y,width,height);
    ctx.fillStyle='#efffea';ctx.textBaseline='middle';ctx.fillText(text,x+pad,y+height/2);
    ctx.restore();
  }
  function render(lm){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(!lm)return
    var p=function(i){return point(lm,i)},head=midpoint(p(7),p(8))||p(0);
    var shoulders=midpoint(p(11),p(12)),hips=midpoint(p(23),p(24));
    var segments=[[p(11),p(13)],[p(13),p(15)],[p(12),p(14)],[p(14),p(16)],[p(23),p(25)],[p(25),p(27)],[p(24),p(26)],[p(26),p(28)],[p(27),p(29)],[p(29),p(31)],[p(27),p(31)],[p(28),p(30)],[p(30),p(32)],[p(28),p(32)],[p(11),p(12)],[p(23),p(24)],[p(11),p(23)],[p(12),p(24)],[head,shoulders]];
    ctx.save();
    ctx.strokeStyle='#a5dec8';ctx.lineWidth=Math.max(2,canvas.width/450);
    segments.forEach(function(pair){if(!pair[0]||!pair[1])return;ctx.beginPath();ctx.moveTo(pair[0].x,pair[0].y);ctx.lineTo(pair[1].x,pair[1].y);ctx.stroke()});
    [head,shoulders,hips,p(11),p(12),p(13),p(14),p(15),p(16),p(23),p(24),p(25),p(26),p(27),p(28),p(29),p(30),p(31),p(32)].forEach(function(q){if(!q)return;ctx.fillStyle='#efffea';ctx.beginPath();ctx.arc(q.x,q.y,Math.max(3,canvas.width/270),0,Math.PI*2);ctx.fill()});
    if(shoulders&&hips){ctx.strokeStyle='#ffbe75';ctx.lineWidth=Math.max(3,canvas.width/320);ctx.beginPath();ctx.moveTo(shoulders.x,shoulders.y);ctx.lineTo(hips.x,hips.y);ctx.stroke()}
    var components=[[head,.08],[midpoint(shoulders,hips),.50],[midpoint(p(11),p(15))||midpoint(p(11),p(13)),.05],[midpoint(p(12),p(16))||midpoint(p(12),p(14)),.05],[midpoint(p(23),p(27))||midpoint(p(23),p(25)),.16],[midpoint(p(24),p(28))||midpoint(p(24),p(26)),.16]];
    var sum=0,cx=0,cy=0;components.forEach(function(item){if(!item[0])return;sum+=item[1];cx+=item[0].x*item[1];cy+=item[0].y*item[1]});
    if(sum>=.65){cx/=sum;cy/=sum;
      function foot(heel,toe,ankle,knee){var h=p(heel),t=p(toe),a=p(ankle),k=p(knee);return midpoint(h,t)||h||t||(a?{x:a.x,y:a.y+Math.max(7,k?Math.abs(a.y-k.y)*.12:10)}:null)}
      var left=foot(29,31,27,25),right=foot(30,32,28,26);
      ctx.strokeStyle='#e6f273';ctx.fillStyle='#e6f273';ctx.lineWidth=Math.max(2,canvas.width/450);
      if(left||right){var ground;
        if(left&&right){var radius=Math.max(12,canvas.width*.04),wl=1/(Math.abs(cx-left.x)+radius),wr=1/(Math.abs(cx-right.x)+radius);ground=(left.y*wl+right.y*wr)/(wl+wr)}
        else ground=(left||right).y;
        if(ground>cy){ctx.setLineDash([10,7]);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,ground);ctx.stroke();ctx.setLineDash([]);
          ctx.beginPath();ctx.arc(cx,ground,Math.max(4,canvas.width/260),0,Math.PI*2);ctx.fill()}
      }
      ctx.beginPath();ctx.arc(cx,cy,Math.max(6,canvas.width/170),0,Math.PI*2);ctx.fill()}
    ctx.restore();
    joints.forEach(function(j,n){var v=angle(p(j[0]),p(j[1]),p(j[2]));drawJointAngle(['左肘','右肘','左膝','右膝'][n],p(j[1]),v,n<2?shoulders:hips)});
  }
  try{pose=new Pose({locateFile:function(f){return 'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f}});pose.setOptions({modelComplexity:0,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:.5,minTrackingConfidence:.5});pose.onResults(function(result){landmarks=result.poseLandmarks||null;render(landmarks);setStatus(landmarks?'骨架辨識中':'未辨識到完整球員；請讓全身入鏡')})}catch(e){setStatus('姿態模型未載入，請重新整理')}
  async function infer(force){if(!pose||!video.videoWidth||busy)return;var now=performance.now();if(!force&&now-lastInfer<60)return;lastInfer=now;busy=true;var id=source;try{var scale=Math.min(1,640/Math.max(video.videoWidth,video.videoHeight)),w=Math.round(video.videoWidth*scale),h=Math.round(video.videoHeight*scale);if(input.width!==w||input.height!==h){input.width=w;input.height=h}ictx.drawImage(video,0,0,w,h);await pose.send({image:input});if(id!==source)clear()}catch(e){clear();setStatus('姿態辨識失敗：'+String(e.message||e).slice(0,65))}finally{busy=false}}
  function tick(){if(!playing)return;infer(false);if(exporting)drawExport();raf=requestAnimationFrame(tick)}
  function pause(){video.pause();playing=false;cancelAnimationFrame(raf);play.textContent='播放'}
  function updateTime(){document.getElementById('time').textContent=time(video.currentTime);if(isFinite(video.duration)&&video.duration>0)seek.value=Math.round(1000*video.currentTime/video.duration)}
  function load(file){if(!file||!file.type.startsWith('video/')){setStatus('請選擇影片檔');return}pause();source++;clear();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);video.src=url;video.load();document.getElementById('empty').classList.add('hidden');setStatus('載入影片中…')}
  function step(n){if(!video.duration)return;pause();video.currentTime=Math.max(0,Math.min(video.duration-.001,video.currentTime+n/fps))}
  document.getElementById('choose').onclick=function(){document.getElementById('file').click()};
  document.getElementById('shoot').onclick=function(){document.getElementById('camera').click()};
  ['file','camera'].forEach(function(id){var el=document.getElementById(id);el.onchange=function(){if(el.files[0])load(el.files[0]);el.value=''}});
  video.onloadedmetadata=function(){var w=video.videoWidth,h=video.videoHeight,s=Math.min(1,1600/Math.max(w,h));canvas.width=Math.round(w*s);canvas.height=Math.round(h*s);screen.style.aspectRatio=w+' / '+h;document.getElementById('duration').textContent=time(video.duration);document.getElementById('image').disabled=false;document.getElementById('export').disabled=!(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream);fps=30;samples=[];lastMediaTime=null;setStatus('影片已載入，開始辨識');infer(true)};
  if(video.requestVideoFrameCallback){var observe=function(now,meta){if(meta.mediaTime!==undefined){var delta=meta.mediaTime-lastMediaTime;if(lastMediaTime!==null&&delta>.004&&delta<.2){samples.push(1/delta);if(samples.length>9)samples.shift();if(samples.length>=5){var a=samples.slice().sort(function(x,y){return x-y});fps=Math.max(10,Math.min(240,Math.round(a[Math.floor(a.length/2)])))}}lastMediaTime=meta.mediaTime}video.requestVideoFrameCallback(observe)};video.requestVideoFrameCallback(observe)}
  video.onloadeddata=function(){infer(true)};
  video.onseeked=function(){updateTime();infer(true)};
  video.ontimeupdate=updateTime;
  video.onplay=function(){playing=true;play.textContent='暫停';cancelAnimationFrame(raf);tick()};
  video.onpause=function(){playing=false;play.textContent='播放';cancelAnimationFrame(raf)};
  video.onended=function(){if(exporting){finishExport();return}if(document.getElementById('loop').checked){video.currentTime=0;video.play()}else pause()};
  play.onclick=function(){if(!video.src){setStatus('請先選擇或拍攝影片');return}if(video.paused)video.play().catch(function(e){setStatus('無法播放：'+e.message)});else pause()};
  [['back1',-1],['back5',-5],['next1',1],['next5',5]].forEach(function(p){document.getElementById(p[0]).onclick=function(){step(p[1])}});
  seek.oninput=function(){if(!video.duration)return;pause();video.currentTime=video.duration*Number(seek.value)/1000};
  document.getElementById('speed').onchange=function(e){video.playbackRate=Number(e.target.value)};
  function composite(target,context){target.width=canvas.width;target.height=canvas.height;context.drawImage(video,0,0,target.width,target.height);context.drawImage(canvas,0,0,target.width,target.height)}
  document.getElementById('image').onclick=function(){if(!video.videoWidth)return;var out=document.createElement('canvas'),c=out.getContext('2d');composite(out,c);out.toBlob(function(blob){if(blob)download(blob,'baseball-frame.png')},'image/png')};
  function download(blob,name){var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},30000)}
  function drawExport(){if(!exporting)return;exportCtx.drawImage(video,0,0,exportCanvas.width,exportCanvas.height);exportCtx.drawImage(canvas,0,0,exportCanvas.width,exportCanvas.height)}
  function finishExport(){if(!exporting)return;exporting=false;pause();if(recorder&&recorder.state!=='inactive')recorder.stop()}
  document.getElementById('export').onclick=async function(){if(!video.duration||exporting)return;var types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];var mime=types.find(function(t){return MediaRecorder.isTypeSupported(t)});if(!mime){setStatus('此瀏覽器不支援影片匯出');return}exportCanvas=document.createElement('canvas');exportCanvas.width=canvas.width;exportCanvas.height=canvas.height;exportCtx=exportCanvas.getContext('2d');var chunks=[];oldTime=video.currentTime;oldLoop=video.loop;pause();video.loop=false;recorder=new MediaRecorder(exportCanvas.captureStream(30),{mimeType:mime});recorder.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};recorder.onstop=function(){download(new Blob(chunks,{type:mime}),'baseball-skeleton.'+(mime.includes('mp4')?'mp4':'webm'));video.loop=oldLoop;video.currentTime=oldTime;document.getElementById('export').disabled=false;setStatus('影片已下載')};document.getElementById('export').disabled=true;video.currentTime=0;await new Promise(function(resolve){video.addEventListener('seeked',resolve,{once:true})});exporting=true;drawExport();recorder.start();video.play().catch(function(e){finishExport();setStatus('匯出失敗：'+e.message)});setStatus('正在合成影片，請保持頁面開啟')};
  window.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.code==='Space'){e.preventDefault();play.click()}});
})();
</script></body></html>
